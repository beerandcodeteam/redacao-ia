<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEO Report — Beer &amp; Code</title>
<link rel="stylesheet" href="assets/dashboard.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
  #refresh svg { transition: transform 0.2s ease; }
  #refresh.spinning svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ============ Top bar ============ -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>SEO Report — <span class="accent">Beer &amp; Code</span></h1>
      <div class="meta" id="meta">carregando…</div>
    </div>
    <div class="topbar-actions">
      <select class="btn btn-secondary win-sel" id="window-sel" title="Janela de datas (afeta GSC e GA4)">
        <option value="7">Últimos 7 dias</option>
        <option value="28">Últimos 28 dias</option>
        <option value="90" selected>Últimos 90 dias</option>
      </select>
      <button class="btn btn-secondary" id="refresh">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="label-full">Atualizar dados</span>
      </button>
      <button class="btn btn-secondary" id="open-chat" title="Chat com todas as métricas">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v6A1.5 1.5 0 0 1 12.5 11H6l-3 3v-3H3.5A1.5 1.5 0 0 1 2 9.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span class="label-full">Chat SEO</span>
      </button>
      <button class="btn btn-primary" id="open-pauta">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1.5l1.6 4.3 4.4.3-3.4 2.8 1.1 4.3L8 11l-3.7 2.5 1.1-4.3L2 6.1l4.4-.3z" fill="currentColor"/></svg>
        Gerar pauta da semana
      </button>
    </div>
  </div>
</header>

<div class="wrap" id="wrap">
  <div class="loading-wrap" id="loading"><span class="spin"></span> Carregando data.json…</div>
</div>

<!-- root template injected by JS into #wrap after load -->
<template id="tpl-dashboard">
  <div id="err-slot"></div>

  <!-- KPI strip -->
  <section class="grid kpis">
    <div class="card kpi"><div class="label">Cliques (GSC)</div><div class="value" id="kpi-clicks">–</div><div class="sub">orgânico</div><svg class="spark" id="spark-clicks"></svg></div>
    <div class="card kpi"><div class="label">Impressões</div><div class="value" id="kpi-impr">–</div><div class="sub" id="sub-impr"></div><svg class="spark" id="spark-impr"></svg></div>
    <div class="card kpi"><div class="label">CTR médio</div><div class="value" id="kpi-ctr">–</div><div class="sub">cliques ÷ impressões</div></div>
    <div class="card kpi"><div class="label">Posição média</div><div class="value" id="kpi-pos">–</div><div class="sub">menor = melhor</div></div>
    <div class="card kpi"><div class="label">Sessões (GA4)</div><div class="value" id="kpi-sessions">–</div><div class="sub" id="sub-sessions"></div></div>
    <div class="card kpi"><div class="label">Usuários</div><div class="value" id="kpi-users">–</div><div class="sub">visitantes únicos</div></div>
    <div class="card kpi"><div class="label">Engajamento</div><div class="value" id="kpi-engage">–</div><div class="sub">taxa de sessões engajadas</div></div>
  </section>

  <!-- Charts -->
  <section class="grid cols-2 section">
    <div class="card chart-card" data-card="performance" data-name="Performance orgânica" data-source="GSC · diário">
      <div class="card-head">
        <div class="card-title">Performance orgânica</div>
        <div style="display:flex;align-items:center;gap:18px">
          <div class="legend">
            <span class="item"><span class="dot" style="background:#ff9500"></span>Cliques</span>
            <span class="item"><span class="dot" style="background:#0a84ff"></span>Impressões</span>
          </div>
          <span class="card-tag">GSC · diário</span>
        </div>
      </div>
      <svg class="line-chart" id="line-chart"></svg>
    </div>
    <div class="card chart-card" data-card="channels" data-name="Canais de tráfego" data-source="GA4">
      <div class="card-head"><div class="card-title">Canais de tráfego</div><span class="card-tag">GA4</span></div>
      <div class="donut-wrap"><svg class="donut-chart" id="donut-chart"></svg><div class="donut-legend" id="donut-legend"></div></div>
    </div>
  </section>

  <!-- Top queries + Oportunidades -->
  <section class="grid cols-2-even section">
    <div class="card tbl-card" data-card="top_queries" data-name="Top queries" data-source="GSC">
      <div class="card-head"><div class="card-title">Top queries</div><span class="card-tag">GSC</span></div>
      <div class="tbl-scroll"><table data-sortable>
        <thead><tr><th>Query</th><th>Cli</th><th>Impr</th><th>CTR</th><th>Pos</th></tr></thead>
        <tbody id="tb-queries"></tbody></table></div>
    </div>
    <div class="card tbl-card" data-card="opportunities" data-name="Oportunidades (pos 5–15)" data-source="Quick wins">
      <div class="card-head"><div class="card-title">⚡ Oportunidades <span style="color:var(--text-3);font-weight:500">(pos 5–15)</span></div><span class="card-tag win">Quick wins</span></div>
      <div class="tbl-scroll"><table data-sortable>
        <thead><tr><th>Query</th><th>Impr</th><th>CTR</th><th>Pos</th></tr></thead>
        <tbody id="tb-opps"></tbody></table></div>
    </div>
  </section>

  <!-- Top páginas -->
  <section class="card tbl-card section" data-card="top_pages" data-name="Top páginas" data-source="GSC">
    <div class="card-head"><div class="card-title">Top páginas</div><span class="card-tag">GSC</span></div>
    <div class="tbl-scroll"><table data-sortable>
      <thead><tr><th>Página</th><th>Cli</th><th>Impr</th><th>CTR</th><th>Pos</th></tr></thead>
      <tbody id="tb-pages"></tbody></table></div>
  </section>

  <!-- Keywords -->
  <section class="grid cols-2-even section">
    <div class="card tbl-card" data-card="hot_keywords" data-name="Keywords quentes" data-source="DataForSEO · BR/PT">
      <div class="card-head"><div class="card-title">🔥 Keywords quentes <span style="color:var(--text-3);font-weight:500">(oportunidade)</span></div><span class="card-tag">DataForSEO · BR/PT</span></div>
      <div class="tbl-scroll"><table data-sortable>
        <thead><tr><th>Keyword</th><th>Vol</th><th>KD</th><th>Δ%</th></tr></thead>
        <tbody id="tb-hot"></tbody></table></div>
    </div>
    <div class="card tbl-card">
      <div class="card-head"><div class="card-title">Keywords que já rankeamos</div><span class="card-tag">DataForSEO</span></div>
      <div class="tbl-scroll"><table data-sortable>
        <thead><tr><th>Keyword</th><th>Pos</th><th>Vol</th></tr></thead>
        <tbody id="tb-ranked"></tbody></table></div>
    </div>
  </section>

  <!-- Landing + Eventos -->
  <section class="grid cols-2 section">
    <div class="card tbl-card" data-card="landing" data-name="Landing pages" data-source="GA4">
      <div class="card-head"><div class="card-title">Landing pages</div><span class="card-tag">GA4</span></div>
      <div class="tbl-scroll"><table data-sortable>
        <thead><tr><th>Página</th><th>Sessões</th><th>Engaj.</th></tr></thead>
        <tbody id="tb-landing"></tbody></table></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">Eventos-chave</div><span class="card-tag">Fase 1</span></div>
      <div id="key-events"></div>
    </div>
  </section>

  <!-- Funil blog → site -->
  <section class="grid cols-2 section">
    <div class="card" data-card="funnel" data-name="Funil blog → beerandcode.com.br" data-source="GA4 · 2 properties">
      <div class="card-head"><div class="card-title">Funil blog → beerandcode.com.br</div><span class="card-tag">GA4 × 2 properties</span></div>
      <div id="funnel-viz"></div>
    </div>
    <div class="card tbl-card">
      <div class="card-head"><div class="card-title">Conversões no site <span style="color:var(--text-3);font-weight:500">(origem blog vs total)</span></div><span class="card-tag">GA4 site</span></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>Evento</th><th>Via blog</th><th>Site total</th><th>Share</th></tr></thead>
        <tbody id="tb-funnel-conv"></tbody></table></div>
      <div class="card-head" style="margin-top:16px"><div class="card-title">CTAs do blog por posição</div><span class="card-tag">GA4 blog</span></div>
      <div class="tbl-scroll"><table data-sortable>
        <thead><tr><th>Posição do CTA</th><th>Cliques</th><th>Usuários</th></tr></thead>
        <tbody id="tb-funnel-cta"></tbody></table></div>
    </div>
  </section>

  <!-- Core Web Vitals -->
  <section class="card tbl-card section" data-card="cwv" data-name="Core Web Vitals" data-source="PageSpeed Insights">
    <div class="card-head"><div class="card-title">Core Web Vitals</div><span class="card-tag">PageSpeed Insights</span></div>
    <div class="tbl-scroll"><table data-sortable>
      <thead><tr><th>URL</th><th class="no-sort">Device</th><th>Perf</th><th>LCP</th><th>CLS</th><th>TBT</th><th>FCP</th></tr></thead>
      <tbody id="tb-cwv"></tbody></table></div>
  </section>
</template>

<!-- ============ Pauta panel ============ -->
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-head">
    <h2>✨ Pauta da semana</h2>
    <button class="panel-close" id="panel-close" aria-label="Fechar">✕</button>
  </div>
  <div class="panel-body">
    <p class="panel-desc">Roda o Claude (skill <code>planejar-pauta</code>) cruzando o relatório atual + seu foco. Puxa GSC/DataForSEO/GA4 ao vivo e devolve a pauta priorizada.</p>
    <div class="field">
      <label for="foco">Foco do ciclo</label>
      <textarea class="input" id="foco" placeholder="Ex.: autoridade no pilar de agentes de IA; priorizar quick wins de tutorial Laravel+IA; aproveitar o que está quente em RAG…"></textarea>
    </div>
    <div class="field">
      <label for="objetivo">Objetivo</label>
      <select class="input" id="objetivo">
        <option value="equilibrio">Equilíbrio (default)</option>
        <option value="quick-wins">Quick wins (tráfego rápido)</option>
        <option value="autoridade">Autoridade de pilar (longo prazo)</option>
        <option value="volume">Volume bruto</option>
      </select>
    </div>
    <div class="field">
      <label for="n-posts">Nº de posts</label>
      <input class="input" id="n-posts" type="number" value="7" min="1" max="30" />
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" id="save-pauta" checked /> Salvar em <code>pautas/&lt;mês&gt;/semana-N.md</code></label>
    </div>
    <button class="btn btn-primary" id="gerar-pauta">▶ Gerar</button>
    <div class="pauta-out" id="pauta-out"></div>
  </div>
</aside>

<!-- ============ Insights chat slideover ============ -->
<aside class="panel chat" id="insights" aria-hidden="true">
  <div class="panel-head">
    <h2>✨ Insights</h2>
    <button class="panel-close" id="insights-close" aria-label="Fechar">✕</button>
  </div>
  <div class="chat-context">
    <span class="ctx-dot"></span>
    <span>Analisando <b id="ctx-name">—</b> · <span id="ctx-source">—</span></span>
  </div>
  <div class="chat-thread" id="chat-thread"></div>
  <div class="chat-suggest" id="chat-suggest"></div>
  <div class="chat-input">
    <textarea id="chat-text" rows="1" placeholder="Pergunte ao Claude sobre estes dados…"></textarea>
    <button class="chat-send" id="chat-send" aria-label="Enviar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M8 3L4 7M8 3l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</aside>

<script src="assets/dashboard.js"></script>
</body>
</html>
